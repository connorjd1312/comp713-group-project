spring.application.name=repair-tickets
spring.datasource.url=jdbc:h2:file:./data/repairdb;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.jpa.open-in-view=false
app.messaging.enabled=${MESSAGING_ENABLED:true}
app.messaging.broker-url=${BROKER_URL:tcp://127.0.0.1:61616}
app.messaging.queue=${BROKER_QUEUE:repair.events}
app.messaging.retry-ms=2000
